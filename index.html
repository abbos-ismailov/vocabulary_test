<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>So‘z yodlash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2214%22%20fill%3D%22%2300c508%22/%3E%3Cpath%20d%3D%22M7%2040C13%2037%2019%2037%2024%2040V24C19%2021%2013%2021%207%2024Z%22%20fill%3D%22%230c1630%22/%3E%3Cpath%20d%3D%22M41%2040C35%2037%2029%2037%2024%2040V24C29%2021%2035%2021%2041%2024Z%22%20fill%3D%22%230c1630%22/%3E%3Cpath%20d%3D%22M11%2028.5C14%2027.5%2017%2027.5%2020%2028.5M11%2033C14%2032%2017%2032%2020%2033M28%2028.5C31%2027.5%2034%2027.5%2037%2028.5M28%2033C31%2032%2034%2032%2037%2033%22%20fill%3D%22none%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%20stroke%3D%22%2300c508%22/%3E%3Cpath%20d%3D%22M24%2025V15%22%20fill%3D%22none%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%20stroke%3D%22%230c1630%22/%3E%3Cpath%20d%3D%22M24%2021C19%2021%2017%2017%2017%2015C22%2015%2024%2018%2024%2021Z%22%20fill%3D%22%230c1630%22/%3E%3Cpath%20d%3D%22M24%2019C29%2019%2031%2015%2031%2013C26%2013%2024%2016%2024%2019Z%22%20fill%3D%22%230c1630%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2212.5%22%20r%3D%223.2%22%20fill%3D%22%23ffcc19%22/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--h:#ffcc19;--en:#ffcc19;--uz:#8ec8ff;--bg:#121b33;--bg2:#1a2747;--card:#223059;--tx:#e8ecf7;--mu:#9fabc9;--pr:#00c508;--pr2:#22d45e;--prt:#0c1630;--ok:#2fd16a;--no:#ff6b6b;--bd:#31457a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b33;--bg2:#1a2747;--card:#223059;--tx:#e8ecf7;--mu:#9fabc9;--pr:#00c508;--pr2:#22d45e;--prt:#0c1630;--ok:#2fd16a;--no:#ff6b6b;--bd:#31457a}}
:root[data-theme="light"]{color-scheme:light;--h:#111;--en:#b02a50;--uz:#2a5f8f;--bg:#fae9d9;--bg2:#f2d9c1;--card:#fff6ee;--tx:#111;--mu:#5e4b3c;--pr:#e48fa0;--pr2:#eeb27a;--prt:#1a1010;--ok:#2e8b57;--no:#c0392b;--bd:#e2c4aa}
:root[data-theme="dark"]{--bg:#121b33;--bg2:#1a2747;--card:#223059;--tx:#e8ecf7;--mu:#9fabc9;--pr:#00c508;--pr2:#22d45e;--prt:#0c1630;--ok:#2fd16a;--no:#ff6b6b;--bd:#31457a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:56px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px;color:var(--h)}h2{font-size:1.2rem;margin:0}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px}
button.p{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--prt);border-color:transparent;font-weight:600}
button.g{border:none;background:none;color:var(--mu)}
body.in{background:var(--bg2)}
#lg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:6;border-radius:99px;padding:7px 14px;font-size:.85rem;font-weight:600;background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--prt);border-color:transparent}
#st{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:14px;z-index:5;font-size:.8rem;color:var(--mu)}
#tg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:5;border-radius:99px;padding:7px 14px;font-size:.85rem;background:var(--card)}
.back{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--prt);border-color:transparent;font-weight:600}
.dng{color:var(--no);border-color:var(--no);font-weight:600;background:transparent}
input.ex{margin:6px 0 0;padding:7px 10px;font-size:.9rem;font-style:italic}
button:disabled{opacity:.5}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:6px 0}
textarea{min-height:200px;resize:vertical}
.set{cursor:pointer}.set:hover{border-color:var(--pr)}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--pr))}
.fc{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.4rem;cursor:pointer;user-select:none;padding:24px}
.fc small{font-size:.85rem;color:var(--mu);margin-top:12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 40%,transparent)}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 40%,transparent)}
.fb{font-weight:600;margin:8px 0}.ok-t{color:var(--ok)}.no-t{color:var(--no)}
.w{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.w:last-child{border:0}.lv{font-size:.75rem;color:var(--mu);white-space:nowrap}
.big{font-size:1.15rem;margin:6px 0 14px}
.en{color:var(--en);font-weight:700}
.uz{color:var(--uz)}
.opt.ok,.opt.no{border-width:2px;font-weight:600}
.scene{perspective:1100px;margin:12px 0;cursor:pointer}
.fcard{position:relative;height:260px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.fcard.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;margin:0;overflow:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.bk{transform:rotateY(180deg)}
.fbk{padding:12px 14px;border-radius:12px;font-weight:700;margin:10px 0;border:2px solid}
.fbk.okb{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 28%,transparent)}
.fbk.nob{border-color:var(--no);background:color-mix(in srgb,var(--no) 28%,transparent)}
</style>
</head>
<body>
<button id="lg" style="display:none">Google bilan kirish</button><span id="st"></span>
<button id="tg" onclick="toggle()"></button>
<main id="app"></main>
<script>
var sets=[],view={n:'home'},S=null;
try{sets=JSON.parse(localStorage.getItem('soz_sets')||'[]')}catch(e){sets=[]}
var stamp=0,dref=null,pend=null,tmr=null;
try{stamp=+localStorage.getItem('soz_t')||0}catch(e){}
function stat(t){var e=$('st');if(e)e.textContent=t}
function save(){stamp=Date.now();try{localStorage.setItem('soz_sets',JSON.stringify(sets));localStorage.setItem('soz_t',stamp)}catch(e){}push()}
function push(){if(!dref)return;stat('☁️ Saqlanmoqda...');clearTimeout(tmr);tmr=setTimeout(function(){dref.set({j:JSON.stringify(sets),t:stamp}).then(function(){stat('☁️ Sinxronlangan')},function(){stat('⚠️ Sinxronlanmadi')})},400)}
function applyR(d){try{sets=JSON.parse(d.j);stamp=d.t;localStorage.setItem('soz_sets',d.j);localStorage.setItem('soz_t',stamp)}catch(e){}var a=document.activeElement,typing=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');if(view.n==='home'||(view.n==='set'&&!view.edit&&!typing))render()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function parse(t){var out=[],bad=0;t.split('\n').forEach(function(l){l=l.trim();if(!l)return;var m=l.match(/\t|\s[-–—]\s|[=:;]|-/);if(!m){bad++;return}var w=l.slice(0,m.index).trim(),d=l.slice(m.index+m[0].length).trim(),p=d.split(/\t|\s\|\s|\|\|/),e='';if(p.length>1){d=p[0].trim();e=p.slice(1).join(' ').trim()}if(w&&d)out.push({w:w,d:d,e:e,l:0});else bad++});return{out:out,bad:bad}}
function cur(){return sets.find(function(s){return s.id===view.id})}
function go(n,id){view={n:n,id:id};if(pend){var d=pend;pend=null;applyR(d)}render()}
function render(){var a=$('app');document.body.className=view.n==='home'?'':'in';
if(view.n==='home'){
var h='<div class="row" style="gap:12px;margin-bottom:6px">'+LOGO+'<h1 style="margin:0">So‘z yodlash</h1></div><p class="mu">Inglizcha so‘zlarni bo‘limlarga ajrating va yodlang.</p><button class="p" onclick="go(\'new\')">+ Yangi bo‘lim</button><h2 style="margin:22px 0 4px">Mening bo‘limlarim</h2>';
if(!sets.length)h+='<div class="card mu">Hozircha bo‘limlar yo‘q. Birinchi bo‘limni yarating.</div>';
sets.forEach(function(s){var k=s.words.filter(function(w){return w.l>=3}).length,p=s.words.length?Math.round(k/s.words.length*100):0;
h+='<div class="card set" onclick="go(\'set\','+s.id+')"><div class="row sp"><h2>'+esc(s.name)+'</h2><span class="mu">'+s.words.length+' ta so‘z</span></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="mu">Yodlangan: '+p+'%</div></div>'});
a.innerHTML=h}
else if(view.n==='new'){
a.innerHTML='<button class="back" onclick="go(\'home\')">← Bo‘limlarga qaytish</button><h1>Yangi bo‘lim</h1><input id="nm" placeholder="Bo‘lim nomi (masalan: Unit 1)"><p class="mu">Har bir qatorga bitta so‘z: <b>word - definition | namuna gap</b> (namuna gap ixtiyoriy). 10, 20 yoki undan ko‘p so‘zni birdan joylashingiz mumkin. Ajratgich: <b>-</b>, <b>=</b>, <b>:</b> yoki Tab.</p><textarea id="ws" placeholder="apple - a round red or green fruit | I eat an apple every day\nbrave - ready to face danger\nlaugh - to make sounds that show you are happy"></textarea><div id="pv" class="mu"></div><button class="p" onclick="create()">Yaratish</button>';
$('ws').oninput=function(){var r=parse(this.value);$('pv').textContent=r.out.length+' ta so‘z tayyor'+(r.bad?' · '+r.bad+' ta qator o‘qilmadi':'')}}
else if(view.n==='set'){var s=cur();if(!s)return go('home');
var h='<button class="back" onclick="go(\'home\')">← Barcha bo‘limlarga qaytish</button><div class="row sp" style="margin-top:12px"><h1>'+esc(s.name)+'</h1><button class="dng" onclick="del()">🗑 Bo‘limni o‘chirish</button></div><p class="mu">'+s.words.length+' ta so‘z · 🌰 yangi → 🌱 → 🌿 → 🌸 yodlangan (3 marta to‘g‘ri). Xato qilsangiz, boshidan boshlanadi.</p>';
var dis=s.words.length<1?' disabled':'',dis2=s.words.length<2?' disabled':'';
h+='<div class="row"><button class="p"'+dis+' onclick="start(\'fc\')">Kartochkalar</button><button class="p"'+dis2+' onclick="start(\'mc\')">Test</button><button class="p"'+dis+' onclick="start(\'ty\')">Yozish</button></div>';
h+='<div class="card"><b>So‘z qo‘shish</b><textarea id="ws" style="min-height:120px" placeholder="word - definition | namuna gap"></textarea><div id="pv" class="mu"></div><button onclick="addw()">Qo‘shish</button></div><div class="card"><b>So‘zlar</b>';
s.words.forEach(function(w,i){if(view.edit===i){h+='<div class="w" style="display:block"><input id="ew" value="'+esc(w.w)+'" placeholder="So‘z"><input id="ed" value="'+esc(w.d)+'" placeholder="Definition"><input id="ee" value="'+esc(w.e||'')+'" placeholder="Namuna gap"><div class="row"><button class="p" onclick="saveW('+i+')">Saqlash</button><button onclick="view.edit=null;render()">Bekor qilish</button></div></div>';return}
h+='<div class="w"><div style="flex:1;min-width:0"><span class="en" style="font-size:1.25rem">'+esc(w.w)+'</span><div class="uz" style="font-size:.9rem">'+esc(w.d)+'</div><input class="ex" value="'+esc(w.e||'')+'" placeholder="Namuna gap qo‘shing..." onchange="setE('+i+',this.value)"></div><div class="row" style="align-items:flex-start"><span class="lv" style="font-size:1.05rem">'+stage(w.l)+'</span><button class="g" style="color:var(--pr)" onclick="view.edit='+i+';render()" title="Tahrirlash">✎</button><button class="g" onclick="rm('+i+')">✕</button></div></div>'});
a.innerHTML=h+'</div>';
$('ws').oninput=function(){var r=parse(this.value);$('pv').textContent=r.out.length+' ta so‘z tayyor'+(r.bad?' · '+r.bad+' ta qator o‘qilmadi':'')}}
else if(view.n==='play')play()}
function create(){var n=$('nm').value.trim(),r=parse($('ws').value);if(!n)return alert('Bo‘lim nomini kiriting');if(!r.out.length)return alert('Kamida bitta so‘z kiriting');
var id=Date.now();sets.unshift({id:id,name:n,words:r.out});save();go('set',id)}
function addw(){var r=parse($('ws').value);if(!r.out.length)return;var s=cur();s.words=s.words.concat(r.out);save();render()}
function saveW(i){var w=$('ew').value.trim(),d=$('ed').value.trim();if(!w||!d)return;var x=cur().words[i];x.w=w;x.d=d;x.e=$('ee').value.trim();view.edit=null;save();render()}
function setE(i,v){cur().words[i].e=v.trim();save()}
function blank(e,w){var lo=e.toLowerCase(),k=w.toLowerCase(),o='',i=0,j;while((j=lo.indexOf(k,i))>-1){o+=e.slice(i,j)+'_____';i=j+k.length}return o+e.slice(i)}
function exl(w){return w.e?'<div class="mu" style="margin:-6px 0 14px;font-style:italic">Namuna: '+esc(S.ans!==null?w.e:blank(w.e,w.w))+'</div>':''}
function rm(i){cur().words.splice(i,1);save();render()}
function del(){if(confirm('Bo‘limni o‘chirasizmi?')){sets=sets.filter(function(s){return s.id!==view.id});save();go('home')}}
function start(mode){var s=cur(),w=s.words.slice().sort(function(a,b){return a.l-b.l||Math.random()-.5}).slice(0,10);
S={mode:mode,q:shuf(w),done:0,total:w.length,ok:0,flip:false,ans:null};view.n='play';render()}
var LOGO='<svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" style="fill:var(--pr)"/><path d="M7 40C13 37 19 37 24 40V24C19 21 13 21 7 24Z" style="fill:var(--prt)"/><path d="M41 40C35 37 29 37 24 40V24C29 21 35 21 41 24Z" style="fill:var(--prt)"/><path d="M11 28.5C14 27.5 17 27.5 20 28.5M11 33C14 32 17 32 20 33M28 28.5C31 27.5 34 27.5 37 28.5M28 33C31 32 34 32 37 33" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:var(--pr)"/><path d="M24 25V15" fill="none" stroke-width="2.5" stroke-linecap="round" style="stroke:var(--prt)"/><path d="M24 21C19 21 17 17 17 15C22 15 24 18 24 21Z" style="fill:var(--prt)"/><path d="M24 19C29 19 31 15 31 13C26 13 24 16 24 19Z" style="fill:var(--prt)"/><circle cx="24" cy="12.5" r="3.2" fill="#ffcc19"/></svg>';
var ST=['🌰','🌱','🌿','🌸'];
function stage(l){return ST[Math.max(0,Math.min(3,l||0))]}
function mark(w,good){w.l=good?Math.min(3,Math.min(3,w.l||0)+1):0;save()}
function ansMark(g){var w=S.q[0];S.good=g;S.old=Math.min(3,w.l||0);mark(w,g);S.nw=w.l}
function fbk(w){var done=S.nw>=3&&S.old<3;return '<div class="fbk '+(S.good?'okb':'nob')+'">'+(S.good?'✓ To‘g‘ri!':'✗ Xato — to‘g‘ri javob: <span class="en" style="font-size:1.2rem">'+esc(w.w)+'</span>')+'<div style="font-weight:500;margin-top:4px;font-size:.85rem">'+stage(S.old)+' → '+stage(S.nw)+(done?' Yodlandi! 🎉':(S.good?'':' · qaytadan boshlanadi'))+'</div></div>'}
function next(good,pre){var w=S.q.shift();if(!pre)mark(w,good);if(good)S.ok++;else S.q.push(w);if(good)S.done++;S.flip=false;S.ans=null;render()}
function play(){var a=$('app'),h='<div class="row sp"><button class="back" onclick="go(\'set\','+view.id+')">← Bo‘limga qaytish</button><span class="mu" style="font-size:.9rem">'+(S.q[0]?stage(S.q[0].l)+' ':'')+S.done+' / '+S.total+'</span></div><div class="bar"><i style="width:'+(S.done/S.total*100)+'%"></i></div>';
if(!S.q.length){var set=cur();h+='<div class="card" style="text-align:center"><h2>Tugadi! 🎉</h2><p class="mu">Siz '+S.total+' ta so‘zni takrorladingiz.</p><button class="p" onclick="start(\''+S.mode+'\')">Yana</button> <button onclick="go(\'set\','+view.id+')">Bo‘limga qaytish</button></div>';a.innerHTML=h;return}
var w=S.q[0];
if(S.mode==='fc'){
var ex=w.e?'<div class="mu" style="margin-top:12px;font-style:italic">'+esc(w.e)+'</div>':'';
h+='<div class="scene" onclick="flipc(this)"><div class="fcard"><div class="face card fc"><div class="uz" style="font-size:1.1rem">'+esc(w.d)+'</div><small>Javobni ko‘rish uchun bosing</small></div><div class="face card fc bk"><div class="en" style="font-size:2rem;margin-bottom:8px">'+esc(w.w)+'</div><div class="uz" style="font-size:1rem">'+esc(w.d)+'</div>'+ex+'</div></div></div>';
h+='<div id="fbt" class="row" style="visibility:hidden"><button style="flex:1" onclick="next(false)">Bilmadim</button><button class="p" style="flex:1" onclick="next(true)">Bildim</button></div>'}
else if(S.mode==='mc'){
if(!S.opts){var o=shuf(cur().words.filter(function(x){return x!==w})).slice(0,3).map(function(x){return x.w});o.push(w.w);S.opts=shuf(o)}
h+='<div class="card"><div class="mu">Qaysi so‘z?</div><div class="big uz">'+esc(w.d)+'</div>'+exl(w);
S.opts.forEach(function(o,i){var c='';if(S.ans!==null){if(o===w.w)c=' ok';else if(i===S.ans)c=' no'}
h+='<button class="opt'+c+'" '+(S.ans!==null?'disabled':'')+' onclick="pick('+i+')"><span class="en" style="font-size:1.2rem">'+esc(o)+'</span></button>'});
if(S.ans!==null)h+=fbk(w);h+='</div>';if(S.ans!==null)h+='<button class="p" onclick="S.opts=null;next(S.good,true)">Davom etish</button>'}
else{
h+='<div class="card"><div class="mu">Inglizcha so‘zni yozing</div><div class="big uz">'+esc(w.d)+'</div>'+exl(w);
if(S.ans===null)h+='<input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="So‘z..."><button class="p" onclick="chk()">Tekshirish</button> <button class="g" onclick="S.ans=\'\';S.bad=true;ansMark(false);render();auto(false)">Bilmayman</button>';
else h+=fbk(w)+(S.bad?'<div class="mu">Sizning javobingiz: '+esc(S.ans||'—')+'</div>':'')+'<button class="p" onclick="S.opts=null;next(S.good,true)" style="margin-top:10px">Davom etish</button>';
h+='</div>'}
a.innerHTML=h;var i=$('in');if(i){i.focus();i.onkeydown=function(e){if(e.key==='Enter')chk()}}
var nb=a.querySelector('button.p');if(S.mode==='ty'&&S.ans!==null){document.onkeydown=function(e){if(e.key==='Enter'&&nb)nb.click()}}else document.onkeydown=null}
function auto(g){var t=S.q[0];setTimeout(function(){if(view.n==='play'&&S&&S.q[0]===t&&S.ans!==null){S.opts=null;next(g,true)}},2000)}
function flipc(el){var c=el.firstChild;S.flip=!S.flip;c.classList.toggle('f',S.flip);if(S.flip){var b=$('fbt');if(b)b.style.visibility='visible'}}
function pick(i){var w=S.q[0];S.ans=i;S.opts0=S.opts[i]===w.w;ansMark(S.opts0);render();auto(S.opts0)}
function chk(){var v=$('in').value.trim(),w=S.q[0];S.ans=v;S.bad=v.toLowerCase()!==w.w.toLowerCase();ansMark(!S.bad);render();auto(!S.bad)}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);var b=$('tg');if(b)b.textContent=t==='light'?'🌙 Tungi rejim':'☀️ Kunduzgi rejim';try{localStorage.setItem('soz_theme',t)}catch(e){}}
